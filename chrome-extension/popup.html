<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isensix Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">ISENSIX TOOLS</p>
        <h1>Page activity</h1>
      </div>
      <span id="status" class="status">Checking</span>
    </header>

    <p id="page" class="page">Checking current page...</p>
    <section aria-labelledby="running-heading">
      <div class="section-heading">
        <h2 id="running-heading">Running on this page</h2>
        <span class="hint">Toggle to disable</span>
      </div>
      <ul id="running-scripts" class="scripts" aria-live="polite">
        <li class="muted">Checking...</li>
      </ul>
    </section>

    <section aria-labelledby="other-heading">
      <div class="section-heading">
        <h2 id="other-heading">Other scripts</h2>
        <span class="hint">Available to enable</span>
      </div>
      <ul id="other-scripts" class="scripts" aria-live="polite">
        <li class="muted">Checking...</li>
      </ul>
    </section>

    <a class="help" href="https://docs.google.com/document/d/1SPD0375j1HjBwO5maCj5_XXBmlDgxA0cy09b2oa6IgQ" target="_blank" rel="noopener">Open technician help</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
